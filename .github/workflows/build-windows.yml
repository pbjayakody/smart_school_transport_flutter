name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE and Installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name smart_school_transport_manager .

      - name: Install packages
        run: flutter pub get

      - name: Check Dart source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release application
        run: flutter build windows --release

      - name: Create portable ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath artifacts\Smart_School_Transport_Manager_Portable.zip -Force

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows_installer.iss"

      - name: Upload downloadable files
        uses: actions/upload-artifact@v4
        with:
          name: Smart-School-Transport-Manager-Windows
          path: |
            artifacts/Smart_School_Transport_Manager_Portable.zip
            artifacts/Smart_School_Transport_Manager_Setup.exe
          if-no-files-found: error
          retention-days: 30
